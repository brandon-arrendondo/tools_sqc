---
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: "Build"
    displayName: "Build"
    jobs:
      - job:
        displayName: "Build"
        steps:
          - checkout: self
            submodules: recursive
            clean: true

          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              source $HOME/.cargo/env
              rustc --version
              cargo --version
            displayName: "Install Rust toolchain (stable)"

          - script: |
              sudo apt-get update
              sudo apt-get install -y libgtk-3-dev
            displayName: "Install system dependencies"

          - script: |
              set -e
              source $HOME/.cargo/env
              echo "Checking code formatting..."
              cargo fmt -- --check || {
                echo "Code formatting check failed. Run 'cargo fmt' to fix."
                exit 1
              }
              echo "Code formatting check passed"
            displayName: "Check code formatting"

          - script: |
              set -e
              source $HOME/.cargo/env
              echo "Running Clippy linter..."
              cargo clippy -- -D warnings || {
                echo "Clippy linting failed. Fix all warnings before proceeding."
                exit 1
              }
              echo "Clippy linting passed"
            displayName: "Run Clippy linting"

          - script: |
              set -e
              source $HOME/.cargo/env
              cargo build --release --verbose
            displayName: "Build Cargo project (release)"

          - script: |
              set -e
              source $HOME/.cargo/env
              cargo install cargo2junit cargo-llvm-cov
            displayName: "Install test and coverage tools"

          - script: |
              set -e
              source $HOME/.cargo/env
              scripts/coverage-gate.sh 75
            displayName: "Run tests with coverage (75% gate)"

          - script: |
              source $HOME/.cargo/env
              RUSTC_BOOTSTRAP=1 cargo test -- -Z unstable-options --format json | cargo2junit > test-results.xml
            displayName: "Generate JUnit test report"
            condition: always()

          - task: PublishTestResults@2
            displayName: "Publish test results"
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "$(Build.SourcesDirectory)/test-results.xml"
              testRunTitle: "sqc unit tests"
            condition: always()

          - task: PublishCodeCoverageResults@2
            displayName: "Publish code coverage"
            inputs:
              summaryFileLocation: "$(Build.SourcesDirectory)/lcov.info"
            condition: always()

          - task: PublishBuildArtifacts@1
            displayName: "Publish build artifact"
            inputs:
              PathtoPublish: "$(Build.SourcesDirectory)/target/release/sqc"
              ArtifactName: "sqc"
              publishLocation: "Container"

  - stage: "Documentation"
    displayName: "Build Documentation"
    dependsOn: Build
    jobs:
      - job: BuildDocs
        displayName: "Build Developer Guide (HTML + PDF)"
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -e
              sudo apt-get update
              sudo apt-get install -y python3-pip latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
              pip install sphinx sphinx-rtd-theme
            displayName: "Install Sphinx and LaTeX"

          - script: |
              set -e
              sphinx-build -b html docs $(Build.ArtifactStagingDirectory)/docs/html
              echo "HTML build complete"
            displayName: "Build HTML documentation"

          - script: |
              set -e
              sphinx-build -M latexpdf docs $(Build.ArtifactStagingDirectory)/docs/pdf
              cp $(Build.ArtifactStagingDirectory)/docs/pdf/latex/sqc-developer-guide.pdf \
                $(Build.ArtifactStagingDirectory)/docs/sqc-developer-guide.pdf
              echo "PDF built: $(ls -lh $(Build.ArtifactStagingDirectory)/docs/sqc-developer-guide.pdf)"
            displayName: "Build PDF documentation"

          - task: PublishBuildArtifacts@1
            displayName: "Publish documentation"
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/docs
              ArtifactName: "documentation"
              publishLocation: "Container"

  - stage: "Benchmark"
    displayName: "Performance Benchmark"
    dependsOn: Build
    jobs:
      - job: BenchmarkMosquitto
        displayName: "Benchmark: mosquitto v2.1.2"
        timeoutInMinutes: 30
        variables:
          MOSQUITTO_TAG: v2.1.2
          MOSQUITTO_REPO: https://github.com/eclipse-mosquitto/mosquitto.git
        steps:
          - checkout: self
            fetchDepth: 1

          - task: DownloadBuildArtifacts@1
            displayName: "Download sqc binary"
            inputs:
              buildType: current
              downloadType: single
              artifactName: sqc
              downloadPath: $(System.ArtifactsDirectory)

          - script: |
              chmod +x $(System.ArtifactsDirectory)/sqc/sqc
            displayName: "Set binary executable"

          - script: |
              set -e
              git clone --depth 1 --branch $(MOSQUITTO_TAG) \
                $(MOSQUITTO_REPO) $(Agent.TempDirectory)/mosquitto
              file_count=$(find $(Agent.TempDirectory)/mosquitto -name "*.c" | wc -l)
              echo "##vso[task.setvariable variable=MOSQUITTO_FILES]$file_count"
              echo "Cloned mosquitto $(MOSQUITTO_TAG): $file_count C files"
            displayName: "Clone mosquitto at pinned tag"

          - script: |
              set -e
              SQC=$(System.ArtifactsDirectory)/sqc/sqc
              MOSQUITTO=$(Agent.TempDirectory)/mosquitto
              RESULTS=$(Build.ArtifactStagingDirectory)/benchmark

              mkdir -p "$RESULTS"

              SQC_VERSION=$("$SQC" --version 2>&1 | head -1 || echo "unknown")
              echo "sqc version: $SQC_VERSION"

              START_NS=$(date +%s%N)

              "$SQC" "$MOSQUITTO" \
                -d "$MOSQUITTO" \
                -e "$RESULTS/mosquitto-violations.json" \
                > /dev/null 2>&1 || true

              END_NS=$(date +%s%N)
              ELAPSED_MS=$(( (END_NS - START_NS) / 1000000 ))
              ELAPSED_S=$(( ELAPSED_MS / 1000 ))

              echo "##vso[task.setvariable variable=SCAN_TIME_MS]$ELAPSED_MS"
              echo "##vso[task.setvariable variable=SCAN_TIME_S]$ELAPSED_S"
              echo "##vso[task.setvariable variable=SQC_VERSION]$SQC_VERSION"
              echo "Scan completed in ${ELAPSED_S}s (${ELAPSED_MS}ms)"
            displayName: "Run sqc benchmark"

          - script: |
              set -e
              RESULTS=$(Build.ArtifactStagingDirectory)/benchmark

              python3 << 'PYEOF'
              import json, collections, os

              results_dir = os.environ.get("BUILD_ARTIFACTSTAGINGDIRECTORY", ".") + "/benchmark"
              data = json.load(open(f"{results_dir}/mosquitto-violations.json"))

              counts = collections.Counter(v["rule_id"] for v in data)
              severity = collections.Counter(v["severity"] for v in data)

              report = {
                  "sqc_version": os.environ.get("SQC_VERSION", "unknown"),
                  "commit_sha": os.environ.get("BUILD_SOURCEVERSION", "unknown"),
                  "build_id": os.environ.get("BUILD_BUILDID", "unknown"),
                  "benchmark_target": {
                      "project": "mosquitto",
                      "tag": os.environ.get("MOSQUITTO_TAG", "v2.1.2"),
                      "c_files": int(os.environ.get("MOSQUITTO_FILES", "0")),
                  },
                  "environment": {
                      "agent": os.environ.get("AGENT_MACHINENAME", "unknown"),
                      "os": os.environ.get("AGENT_OS", "unknown"),
                      "pool": "ubuntu-latest",
                  },
                  "results": {
                      "total_violations": len(data),
                      "scan_time_ms": int(os.environ.get("SCAN_TIME_MS", "0")),
                      "scan_time_seconds": int(os.environ.get("SCAN_TIME_S", "0")),
                      "by_severity": dict(severity),
                      "top_20_rules": [
                          {"rule": r, "count": c}
                          for r, c in counts.most_common(20)
                      ],
                      "all_rules": dict(counts.most_common()),
                  },
              }

              with open(f"{results_dir}/benchmark-report.json", "w") as f:
                  json.dump(report, f, indent=2)

              r = report["results"]
              print(f"SqC version:    {report['sqc_version']}")
              print(f"Commit:         {report['commit_sha'][:8]}")
              print(f"Violations:     {r['total_violations']}")
              print(f"Scan time:      {r['scan_time_seconds']}s ({r['scan_time_ms']}ms)")
              print(f"Files:          {report['benchmark_target']['c_files']}")
              print(f"Unique rules:   {len(counts)}")
              print("---")
              print("Top 10 rules:")
              for entry in r["top_20_rules"][:10]:
                  print(f"  {entry['rule']}: {entry['count']}")
              print("---")
              print("By severity:")
              for sev in ["Critical", "High", "Medium", "Low"]:
                  print(f"  {sev}: {r['by_severity'].get(sev, 0)}")
              PYEOF
            displayName: "Generate benchmark report"

          - task: PublishBuildArtifacts@1
            displayName: "Publish benchmark results"
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/benchmark
              ArtifactName: "benchmark-mosquitto"
              publishLocation: "Container"
            condition: always()

  - stage: "Package"
    displayName: "Package"
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: PublishCrate
        displayName: "Publish Crate"
        variables:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        steps:
          - checkout: self
            submodules: true

          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              source $HOME/.cargo/env
              rustc --version
              cargo --version
            displayName: "Install Rust toolchain (stable)"

          - script: |
              sudo apt-get update
              sudo apt-get install -y libgtk-3-dev
            displayName: "Install system dependencies"

          - task: CargoAuthenticate@0
            displayName: "Authenticate Cargo with Azure Artifacts"
            inputs:
              configFile: "$(Build.SourcesDirectory)/.cargo/config.toml"

          - script: |
              source $HOME/.cargo/env
              cargo publish --registry ELEC_SW_Rust_Packages --allow-dirty
            displayName: "Publish crate to Azure Artifacts"

      - job: PublishBinary
        displayName: "Publish Binary"
        steps:
          - checkout: self
            fetchDepth: 1

          - task: DownloadBuildArtifacts@1
            displayName: "Download build artifact"
            inputs:
              buildType: current
              downloadType: single
              artifactName: sqc
              downloadPath: $(System.ArtifactsDirectory)

          - script: |
              chmod +x $(System.ArtifactsDirectory)/sqc/sqc
            displayName: "Set binary executable"

          - script: |
              SQC_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
              echo "##vso[task.setvariable variable=SQC_VERSION]$SQC_VERSION"
              echo "Publishing sqc version: $SQC_VERSION"
            displayName: "Extract version from Cargo.toml"

          - task: UniversalPackages@0
            displayName: "Publish binary to Azure Artifacts"
            inputs:
              command: publish
              publishDirectory: $(System.ArtifactsDirectory)/sqc
              feedsToUsePublish: internal
              vstsFeedPublish: ELEC_SW/ELEC_SW_Rust_Packages
              vstsFeedPackagePublish: sqc
              versionOption: custom
              versionPublish: $(SQC_VERSION)
