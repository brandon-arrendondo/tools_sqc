[package]
name = "sqc"
version = "0.1.0"
edition = "2021"
description = "Software Code Quality - CERT C compliance checker"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
ratatui = "0.28"
crossterm = "0.28"
git2 = "0.19"
tree-sitter = "0.22"
tree-sitter-c = "0.21"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.5"
csv = "1.3"
sha2 = "0.10"
rfd = "0.14"
rust_xlsxwriter = "0.79"

[dev-dependencies]
tempfile = "3.14"
