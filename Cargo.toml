[package]
name = "sqc"
version = "0.1.0"
edition = "2021"
description = "Software Code Quality - CERT C compliance checker"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "3.2", features = ["derive"] }
