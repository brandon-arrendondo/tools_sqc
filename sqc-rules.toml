[metadata]
name = "CERT C Rules Configuration"
version = "1.0.0"
description = "Configuration for CERT C coding standards compliance checking"
cert_version = "2016"

[rules.ARR30-C]
enabled = true
severity = "High"
description = "Do not form or use out-of-bounds pointers or array subscripts"
category = "Rule"
cert_id = "ARR30-C"

[rules.ARR32-C]
enabled = true
severity = "High"
description = "Ensure size arguments for variable length arrays are in a valid range"
category = "Rule"
cert_id = "ARR32-C"

[rules.STR31-C]
enabled = true
severity = "Medium"
description = "Guarantee that storage for strings has sufficient space for character data and the null terminator"
category = "Rule"
cert_id = "STR31-C"

[rules.DCL00-C]
enabled = true
severity = "High"
description = "Const-qualify immutable objects"
category = "Recommendation"
cert_id = "DCL00-C"

[rules.EXP33-C]
enabled = true
severity = "Medium"
description = "Do not read uninitialized memory"
category = "Rule"
cert_id = "EXP33-C"

[rules.INT30-C]
enabled = true
severity = "High"
description = "Ensure that unsigned integer operations do not wrap"
category = "Rule"
cert_id = "INT30-C"

[rules.MEM30-C]
enabled = true
severity = "Critical"
description = "Do not access freed memory"
category = "Rule"
cert_id = "MEM30-C"

[rules.FIO30-C]
enabled = true
severity = "Medium"
description = "Exclude user input from format strings"
category = "Rule"
cert_id = "FIO30-C"

# Example of a disabled rule
[rules.MSC00-C]
enabled = false
severity = "Low"
description = "Compile cleanly at high warning levels"
category = "Recommendation"
cert_id = "MSC00-C"