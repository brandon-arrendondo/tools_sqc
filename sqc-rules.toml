[metadata]
name = "CERT C Rules Configuration"
version = "1.0.0"
description = "Configuration for CERT C coding standards compliance checking"
cert_version = "2016"

[rules.ARR30-C]
enabled = true
severity = "High"
description = "Do not form or use out-of-bounds pointers or array subscripts"
category = "Rule"
cert_id = "ARR30-C"

[rules.ARR32-C]
enabled = true
severity = "High"
description = "Ensure size arguments for variable length arrays are in a valid range"
category = "Rule"
cert_id = "ARR32-C"

[rules.ARR36-C]
enabled = true
severity = "High"
description = "Do not subtract or compare two pointers that do not refer to the same array"
category = "Rule"
cert_id = "ARR36-C"

[rules.ARR37-C]
enabled = true
severity = "High"
description = "Do not add or subtract an integer to a pointer to a non-array object"
category = "Rule"
cert_id = "ARR37-C"

[rules.ARR38-C]
enabled = true
severity = "High"
description = "Guarantee that library functions do not form invalid pointers"
category = "Rule"
cert_id = "ARR38-C"

[rules.ARR39-C]
enabled = true
severity = "High"
description = "Do not add or subtract a scaled integer to a pointer"
category = "Rule"
cert_id = "ARR39-C"

[rules.STR31-C]
enabled = true
severity = "Medium"
description = "Guarantee that storage for strings has sufficient space for character data and the null terminator"
category = "Rule"
cert_id = "STR31-C"

[rules.DCL00-C]
enabled = true
severity = "Medium"
description = "Const-qualify immutable objects"
category = "Recommendation"
cert_id = "DCL00-C"

[rules.EXP33-C]
enabled = true
severity = "High"
description = "Do not read uninitialized memory"
category = "Rule"
cert_id = "EXP33-C"

[rules.EXP34-C]
enabled = true
severity = "High"
description = "Do not dereference null pointers"
category = "Rule"
cert_id = "EXP34-C"

[rules.PRE30-C]
enabled = true
severity = "High"
description = "Do not create a universal character name through concatenation"
category = "Rule"
cert_id = "PRE30-C"

[rules.PRE31-C]
enabled = true
severity = "High"
description = "Avoid side effects in arguments to unsafe macros"
category = "Rule"
cert_id = "PRE31-C"

[rules.PRE32-C]
enabled = true
severity = "High"
description = "Do not use preprocessor directives in invocations of function-like macros"
category = "Rule"
cert_id = "PRE32-C"

[rules.INT30-C]
enabled = true
severity = "High"
description = "Ensure that unsigned integer operations do not wrap"
category = "Rule"
cert_id = "INT30-C"

[rules.MEM30-C]
enabled = true
severity = "Critical"
description = "Do not access freed memory"
category = "Rule"
cert_id = "MEM30-C"

[rules.FIO30-C]
enabled = true
severity = "Medium"
description = "Exclude user input from format strings"
category = "Rule"
cert_id = "FIO30-C"

# Example of a disabled rule
[rules.MSC00-C]
enabled = false
severity = "Low"
description = "Compile cleanly at high warning levels"
category = "Recommendation"
cert_id = "MSC00-C"