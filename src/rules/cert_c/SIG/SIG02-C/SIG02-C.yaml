id: SIG02-C
type: recommendation
category: SIG
number: 2
metadata:
  title: Avoid using signals to implement normal functionality
  description: "Avoid using signals to implement normal functionality. Signal handlers\
    \ are severely limited in the actions they can perform in a portably secure manner.\
    \ Their use should be reserved for abnormal events that can be serviced by little\
    \ more than logging.\n\nThis noncompliant code example uses signals as a means\
    \ to pass state changes around in a multithreaded environment:\n\n/* THREAD 1\
    \ */\nint do_work(void) {\n  /* ... */\n  kill(THR2_PID, SIGUSR1);\n}\n\n/* THREAD\
    \ 2 */\nvolatile sig_atomic_t flag;\n\nvoid sigusr1_handler(int signum) {\n  flag\
    \ = 1;\n}\n\nint wait_and_work(void) {\n  flag = 0;\n  while (!flag) {}\n  /*\
    \ ... */\n}"
  severity: High
  likelihood: Probable
  priority: P6
  level: L2
  cert_version: 2016 Edition (Wiki)
