id: PRE01-C
type: recommendation
category: PRE
number: 1
metadata:
  title: Use parentheses within macros around parameter names
  description: 'Parenthesize all parameter names in macro definitions. See alsoPRE00-C.
    Prefer inline or static functions to function-like macrosandPRE02-C. Macro replacement
    lists should be parenthesized.


    ThisCUBE()macro definition is noncompliant because it fails to parenthesize the
    parameter names:


    #define CUBE(I) (I * I * I)'
