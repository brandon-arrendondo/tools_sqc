id: MSC30-C
type: rule
category: MSC
number: 30
metadata:
  title: Do not use the rand() function for generating pseudorandom numbers
  description: 'Pseudorandom number generators use mathematical algorithms to produce
    a sequence of numbers with good statistical properties, but the numbers produced
    are not genuinely random.


    The C Standardrand()function makes no guarantees as to the quality of the random
    sequence produced. The numbers generated by some implementations ofrand()have
    a comparatively short cycle and the numbers can be predictable. Applications that
    have strong pseudorandom number requirements must use a generator that is known
    to be sufficient for their needs.


    The following noncompliant code generates an ID with a numeric part produced by
    calling therand()function. The IDs produced are predictable and have limited randomness.'
  severity: Medium
  likelihood: Unlikely
  priority: P4
  level: L3
