id: MEM34-C
type: rule
category: MEM
number: 34
metadata:
  title: Only free memory allocated dynamically
  description: 'The C Standard, Annex J (184) [ISO/IEC 9899:2024], states that the
    behavior of a program isundefinedwhen


    See alsoundefined behavior 184.


    Freeing memory that is not allocated dynamically can result in heap corruption
    and other serious errors. Do not callfree()on a pointer other than one returned
    by a standard memory allocation function, such asmalloc(),calloc(),realloc(),
    oraligned_alloc().'
  severity: High
  likelihood: Likely
