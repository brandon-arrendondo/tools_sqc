id: MEM31-C
type: rule
category: MEM
number: 31
metadata:
  title: Free dynamically allocated memory when no longer needed
  description: "Before the lifetime of the last pointer that stores the return value\
    \ of a call to a standard memory allocation function has ended, it must be matched\
    \ by a call tofree()with that pointer value.\n\nIn this noncompliant example,\
    \ the object allocated by the call tomalloc()is not freed before the end of the\
    \ lifetime of the last pointertext_bufferreferring to the object:\n\n#include\
    \ <stdlib.h>\n \nenum { BUFFER_SIZE = 32 };\n\nint f(void) {\n  char *text_buffer\
    \ = (char *)malloc(BUFFER_SIZE); \n  if (text_buffer == NULL) {\n    return -1;\n\
    \  }\n  return 0;\n}"
  severity: Medium
  likelihood: Probable
  priority: P4
