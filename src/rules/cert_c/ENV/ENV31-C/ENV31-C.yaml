id: ENV31-C
type: recommendation
category: ENV
number: 31
metadata:
  title: Do not rely on an environment pointer following an operation that may invalidate
    it
  description: 'Some implementations provide a nonportable environment pointer that
    is valid whenmain()is called but may be invalidated by operations that modify
    the environment.


    The C Standard, J.5.2 [ISO/IEC 9899:2024], states


    Consequently, under ahosted environmentsupporting this common extension, it is
    possible to access the environment through a modified form ofmain():'
  severity: Low
  likelihood: Probable
  priority: P4
  level: L3
