id: INT18-C
type: recommendation
category: INT
number: 18
metadata:
  title: Evaluate integer expressions in a larger size before comparing or assigning
    to that size
  description: "If an integer expression involving an operation is compared to or\
    \ assigned to a larger integer size, that integer expression should be evaluated\
    \ in that larger size by explicitly casting one of the operands.\n\nThis code\
    \ example is noncompliant on systems wheresize_tis an unsigned 32-bit value andlong\
    \ longis a 64-bit value. In this example, the programmer tests for wrapping by\
    \ comparingSIZE_MAXtolength + BLOCK_HEADER_SIZE. Becauselengthis declared assize_t,\
    \ the addition is performed as a 32-bit operation and can result in wrapping.\
    \ The comparison withSIZE_MAXwill always test false. If any wrapping occurs,malloc()will\
    \ allocate insufficient space formBlock, which can lead to a subsequent buffer\
    \ overflow.\n\n#include <stdlib.h>\n#include <stdint.h>  /* For SIZE_MAX */\n\
     \nenum { BLOCK_HEADER_SIZE = 16 };\n\nvoid *AllocateBlock(size_t length) {\n\
    \  struct memBlock *mBlock;\n\n  if (length + BLOCK_HEADER_SIZE > (unsigned long\
    \ long)SIZE_MAX)\n    return NULL;\n  mBlock = (struct memBlock *)malloc(\n  \
    \  length + BLOCK_HEADER_SIZE\n  );\n  if (!mBlock) { return NULL; }\n  /* Fill\
    \ in block header and return data portion */\n\n  return mBlock;\n}"
  severity: High
  likelihood: Likely
