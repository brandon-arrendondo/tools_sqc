id: INT04-C
type: recommendation
category: INT
number: 4
metadata:
  title: Enforce limits on integer values originating from tainted sources
  description: "All integer values originating fromtainted sourcesshould be evaluated\
    \ to determine if they have identifiable upper and lower bounds. If so, these\
    \ limits should be enforced by the interface. Restricting the input of excessively\
    \ large or small integers helps prevent overflow, truncation, and other type range\
    \ errors. Furthermore, it is easier to find and correct input problems than it\
    \ is to trace internal errors back to faulty inputs.\n\nIn this noncompliant code\
    \ example,lengthis the value of a user-defined (and thus potentially untrusted)\
    \ environment variable whose value is used to determine the size of a dynamically\
    \ allocated array,table. In compliance withINT30-C. Ensure that unsigned integer\
    \ operations do not wrap, the code preventsunsigned integer wrappingbut does not\
    \ impose any upper bound on the size of the array, making it possible for the\
    \ user to cause the program to use an excessive amount of memory.\n\nchar** create_table(void)\
    \ {\n  const char* const lenstr = getenv(\"TABLE_SIZE\");\n  const size_t length\
    \ = lenstr ? strtoul(lenstr, NULL, 10) : 0;\n\n  if (length > SIZE_MAX / sizeof(char\
    \ *))\n    return NULL;   /* Indicate error to caller */\n\n  const size_t table_size\
    \ = length * sizeof(char *);\n  char** const table = (char **)malloc(table_size);\n\
    \n  if (table == NULL)\n    return NULL;   /* Indicate error to caller */\n\n\
    \  /* Initialize table... */\n  return table;\n}"
  severity: High
  likelihood: Probable
  priority: P12
