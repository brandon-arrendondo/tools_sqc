id: EXP37-C
type: rule
category: EXP
number: 37
metadata:
  title: Call functions with the correct number and type of arguments
  description: 'Do not call a function with the wrong number or type of arguments.


    The C Standard identifies two distinct situations in whichundefined behavior(UB)
    may arise as a result of invoking a function using a declaration that is incompatible
    with its definition or by supplying incorrect types or numbers of arguments:


    UBDescription25A pointer is used to call a function whose type is not compatible
    with the referenced type (6.3.2.3).37A function is defined with a type that is
    not compatible with the type (of the expression) pointed to by the expression
    that denotes the called function (6.5.2.2).'
