id: EXP32-C
type: rule
category: EXP
number: 32
metadata:
  title: Do not access a volatile object through a nonvolatile reference
  description: 'An object that has volatile-qualified type may be modified in ways
    unknown to theimplementationor have other unknownside effects. Referencing a volatile
    object by using a non-volatile lvalue isundefined behavior. The C Standard, 6.7.4
    paragraph 7 [ISO/IEC 9899:2024], states


    Seeundefined behavior 62.


    In this noncompliant code example, a volatile object is accessed through a non-volatile-qualified
    reference, resulting inundefined behavior 62:'
