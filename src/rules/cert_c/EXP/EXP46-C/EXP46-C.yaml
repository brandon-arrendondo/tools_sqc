id: EXP46-C
type: rule
category: EXP
number: 46
metadata:
  title: Do not use a bitwise operator with a Boolean-like operand
  description: "Mixing bitwise and relational operators in the same full expression\
    \ can be a sign of a logic error in the expression where a logical operator is\
    \ usually the intended operator. Do not use the bitwise AND (&), bitwise OR (|),\
    \ or bitwise XOR (^) operators with an operand of type_Bool, or the result of\
    \ arelational-expressionorequality-expression. If the bitwise operator is intended,\
    \ it should be indicated with use of a parenthesized expression.\n\nIn this noncompliant\
    \ code example, a bitwise&operator is used with the results of twoequality-expressions:\n\
    \nif (getuid() == 0 & getgid() == 0) { \n  /* ... */ \n}"
  severity: Low
  likelihood: Likely
  priority: P9
  level: L2
