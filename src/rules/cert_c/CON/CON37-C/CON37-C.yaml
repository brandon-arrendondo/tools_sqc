id: CON37-C
type: recommendation
category: CON
number: 37
metadata:
  title: Do not call signal() in a multithreaded program
  description: "Calling thesignal()function in a multithreaded program isundefined\
    \ behavior. (Seeundefined behavior 135.)\n\nThis noncompliant code example invokes\
    \ thesignal()function from a multithreaded program:\n\n#include <signal.h>\n#include\
    \ <stddef.h>\n#include <threads.h>\n \nvolatile sig_atomic_t flag = 0;\n\nvoid\
    \ handler(int signum) {\n  flag = 1;\n}\n\n/* Runs until user sends SIGUSR1 */\n\
    int func(void *data) {\n  while (!flag) {\n    /* ... */\n  }\n  return 0;\n}\n\
    \nint main(void) {\n  signal(SIGUSR1, handler); /* Undefined behavior */\n  thrd_t\
    \ tid;\n  \n  if (thrd_success != thrd_create(&tid, func, NULL)) {\n    /* Handle\
    \ error */\n  }\n  /* ... */\n  return 0;\n}"
  severity: Low
  likelihood: Probable
  priority: P4
  level: L3
