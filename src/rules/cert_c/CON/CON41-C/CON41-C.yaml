id: CON41-C
type: rule
category: CON
number: 41
metadata:
  title: Wrap functions that can fail spuriously in a loop
  description: "Functions that can fail spuriously should be wrapped in a loop.  Theatomic_compare_exchange_weak()andatomic_compare_exchange_weak_explicit()functions\
    \ both attempt to set an atomic variable to a new value but only if it currently\
    \ possesses a known old value. Unlike the related functionsatomic_compare_exchange_strong()andatomic_compare_exchange_strong_explicit(),\
    \ these functions are permitted tofail spuriously. This makes these functions\
    \ faster on some platforms—for example, on architectures that implement compare-and-exchange\
    \ using load-linked/store-conditional instructions, such as Alpha, ARM, MIPS,\
    \ and PowerPC. The C Standard, 7.17.7.4, paragraph 5 [ISO/IEC 9899:2024], describes\
    \ this behavior:A weak compare-and-exchange operation may fail spuriously. That\
    \ is, even when the contents of memory referred to byexpectedandobjectare equal,\
    \ it may return zero and store back toexpectedthe same memory contents that were\
    \ originally there.Noncompliant Code ExampleIn this noncompliant code example,reorganize_data_structure()is\
    \ to be used as an argument tothrd_create().  After reorganizing, the function\
    \ attempts to replace the head pointer so that it points to the new version. \
    \ If no other thread has changed the head pointer since it was originally loaded,reorganize_data_structure()is\
    \ intended to exit the thread with a result oftrue, indicating success.  Otherwise,\
    \ the new reorganization attempt is discarded and the thread is exited with a\
    \ result offalse.  However,atomic_compare_exchange_weak()may fail even when the\
    \ head pointer has not changed. Therefore,reorganize_data_structure()may perform\
    \ the work and then discard it unnecessarily.#include <stdatomic.h>\n#include\
    \ <stdbool.h>\n\nstruct data {\n  struct data *next;\n  /* ... */\n};\n\nextern\
    \ void cleanup_data_structure(struct data *head);\n\nint reorganize_data_structure(void\
    \ *thread_arg) {\n  struct data *_Atomic *ptr_to_head = thread_arg;\n  struct\
    \ data *old_head = atomic_load(ptr_to_head);\n  struct data *new_head;\n  bool\
    \ success;\n\n  /* ... Reorganize the data structure ... */\n\n  success = atomic_compare_exchange_weak(ptr_to_head,\n\
    \                                         &old_head, new_head);\n  if (!success)\
    \ {\n    cleanup_data_structure(new_head);\n  }\n  return success; /* Exit the\
    \ thread */\n}Compliant Solution (atomic_compare_exchange_weak())To recover from\
    \ spurious failures, a loop must be used.  However,atomic_compare_exchange_weak()might\
    \ fail because the head pointer changed, or the failure may be spurious. In either\
    \ case, the thread must perform the work repeatedly until the compare-and-exchange\
    \ succeeds, as shown in this compliant solution:#include <stdatomic.h>\n#include\
    \ <stdbool.h>\n#include <stddef.h>\n\nstruct data {\n  struct data *next;\n  /*\
    \ ... */\n};\n\nextern void cleanup_data_structure(struct data *head);\n\nint\
    \ reorganize_data_structure(void *thread_arg) {\n  struct data *_Atomic *ptr_to_head\
    \ = thread_arg;\n  struct data *old_head = atomic_load(ptr_to_head);\n  struct\
    \ data *new_head = NULL;\n  struct data *saved_old_head;\n  bool success;\n\n\
      do {\n    if (new_head != NULL) {\n      cleanup_data_structure(new_head);\n\
    \    }\n    saved_old_head = old_head;\n\n  /* ... Reorganize the data structure\
    \ ... */\n\n  } while (!(success = atomic_compare_exchange_weak(\n           \
    \    ptr_to_head, &old_head, new_head\n             )) && old_head == saved_old_head);\n\
    \  return success; /* Exit the thread */\n}This loop could also be part of a larger\
    \ control flow; for example, the thread from the noncompliant code example could\
    \ be retried if it returnsfalse.Compliant Solution (atomic_compare_exchange_strong())When\
    \ a weak compare-and-exchange would require a loop and a strong one would not,\
    \ the strong one is preferable, as in this compliant solution:#include <stdatomic.h>\n\
    #include <stdbool.h>\n\nstruct data {\n  struct data *next;\n  /* ... */\n};\n\
    \nextern void cleanup_data_structure(struct data *head);\n\nint reorganize_data_structure(void\
    \ *thread_arg) {\n  struct data *_Atomic *ptr_to_head = thread_arg;\n  struct\
    \ data *old_head = atomic_load(ptr_to_head);\n  struct data *new_head;\n  bool\
    \ success;\n\n  /* ... Reorganize the data structure ... */\n\n  success = atomic_compare_exchange_strong(\n\
    \    ptr_to_head, &old_head, new_head\n  );\n  if (!success) {\n    cleanup_data_structure(new_head);\n\
    \  }\n  return success; /* Exit the thread */\n}Risk AssessmentFailing to wrap\
    \ theatomic_compare_exchange_weak()andatomic_compare_exchange_weak_explicit()functions\
    \ in a loop can result in incorrect values and control flow.RuleSeverityLikelihoodDetectableRepairablePriorityLevelCON41-CLowUnlikelyYesNoP2L3Automated\
