id: CON07-C
type: recommendation
category: CON
number: 7
metadata:
  title: Ensure that compound operations on shared variables are atomic
  description: "Compound operations are operations that consist of more than one discrete\
    \ operation. Expressions that include postfix or prefix increment (++), postfix\
    \ or prefix decrement (--), or compound assignment operators always result in\
    \ compound operations. Compound assignment expressions use operators such as*=,/=,%=,+=,-=,<<=,>>=,^=,\
    \ and|=. Compound operations on shared variables must be performed atomically\
    \ to preventdata races.Noncompliant Code Example (Logical Negation)This noncompliant\
    \ code example declares a shared_Boolflagvariable and provides atoggle_flag()method\
    \ that negates the current value offlag:#include <stdbool.h>\n \nstatic bool flag\
    \ = false;\n \nvoid toggle_flag(void) {\n  flag = !flag;\n}\n \nbool get_flag(void)\
    \ {\n  return flag;\n}Execution of this code may result in adata racebecause the\
    \ value offlagis read, negated, and written back.Consider, for example, two threads\
    \ that calltoggle_flag(). The expected effect of togglingflagtwice is that it\
    \ is restored to its original value. However, the following scenario leavesflagin\
    \ the incorrect state:Timeflag=ThreadAction1truet1Reads the current value offlag,true,\
    \ into a cache2truet2Reads the current value offlag, (still)true, into a different\
    \ cache3truet1Toggles the temporary variable in the cache tofalse4truet2Toggles\
    \ the temporary variable in the different cache tofalse5falset1Writes the cache\
    \ variable's value toflag6falset2Writes the different cache variable's value toflagAs\
    \ a result, the effect of the call byt2is not reflected inflag; the program behaves\
    \ as iftoggle_flag()was called only once, not twice.Compliant Solution (Mutex)This\
    \ compliant solution restricts access toflagunder a mutex lock:#include <threads.h>\n\
    #include <stdbool.h>\n \nstatic bool flag = false;\nmtx_t flag_mutex;\n\n/* Initialize\
    \ flag_mutex */\nbool init_mutex(int type) {\n  /* Check mutex type */\n  if (thrd_success\
    \ != mtx_init(&flag_mutex, type)) {\n    return false;  /* Report error */\n \
    \ }\n  return true;\n}\n \nvoid toggle_flag(void) {\n  if (thrd_success != mtx_lock(&flag_mutex))\
    \ {\n    /* Handle error */\n  }\n  flag = !flag;\n  if (thrd_success != mtx_unlock(&flag_mutex))\
    \ {\n    /* Handle error */\n  }\n}\n \nbool get_flag(void) {\n  bool temp_flag;\n\
    \  if (thrd_success != mtx_lock(&flag_mutex)) {\n    /* Handle error */\n  }\n\
    \  temp_flag = flag;\n  if (thrd_success != mtx_unlock(&flag_mutex)) {\n    /*\
    \ Handle error */\n  }\n  return temp_flag;\n}This solution guards reads and writes\
    \ to theflagfield with a lock on theflag_mutex. This lock ensures that changes\
    \ toflagare visible to all threads. Now, only two execution orders are possible.\
    \ In one execution order, t1obtains the mutex and completes the operation beforet2can\
    \ acquire the mutex, as shown here:Timeflag=ThreadAction1truet1Reads the current\
    \ value offlag,true, into a cache variable2truet1Toggles the cache variable tofalse3falset1Writes\
    \ the cache variable's value toflag4falset2Reads the current value offlag,false,\
    \ into a different cache variable5falset2Toggles the different cache variable\
    \ totrue6truet2Writes the different cache variable's value toflagThe other execution\
    \ order is similar, except thatt2starts and finishes beforet1.Compliant Solution\
    \ (atomic_compare_exchange_weak())This compliant solution uses atomic variables\
    \ and a compare-and-exchange operation to guarantee that the correct value is\
    \ stored inflag. All updates are visible to other threads.#include <stdatomic.h>\n\
    #include <stdbool.h>\n \nstatic atomic_bool flag;\n\nvoid init_flag(void) {\n\
    \  atomic_init(&flag, false);\n}\nvoid toggle_flag(void) {\n  bool old_flag =\
    \ atomic_load(&flag);\n  bool new_flag;\n  do {\n    new_flag = !old_flag;\n \
    \ } while (!atomic_compare_exchange_weak(&flag, &old_flag, new_flag));\n}\n  \n\
    bool get_flag(void) {\n  return atomic_load(&flag);\n}An alternative solution\
    \ is to use theatomic_flagdata type for managing Boolean values atomically.Noncompliant\
    \ Code Example (Addition of Primitives)In this noncompliant code example, multiple\
    \ threads can invoke theset_values()method to set theaandbfields. Because this\
    \ code fails to test for integer overflow, users of this code must also ensure\
    \ that the arguments to theset_values()method can be added without overflow (seeINT32-C.\
    \ Ensure that operations on signed integers do not result in overflowfor more\
    \ information).static int a;\nstatic int b;\n \nint get_sum(void) {\n  return\
    \ a + b;\n}\n \nvoid set_values(int new_a, int new_b) {\n  a = new_a;\n  b = new_b;\n\
    }Theget_sum()method contains a race condition. For example, whenaandbcurrently\
    \ have the values0andINT_MAX, respectively, and one thread callsget_sum()while\
    \ another callsset_values(INT_MAX, 0), theget_sum()method might return either0orINT_MAX,\
    \ or it might overflow. Overflow will occur when the first thread readsaandbafter\
    \ the second thread has set the value ofatoINT_MAXbut before it has set the value\
    \ ofbto0.Noncompliant Code Example (Addition of Atomic Integers)In this noncompliant\
    \ code example,aandbare replaced with atomic integers.#include <stdatomic.h>\n\
    \nstatic atomic_int a;\nstatic atomic_int b;\n\nvoid init_ab(void) {\n  atomic_init(&a,\
    \ 0);\n  atomic_init(&b, 0);\n}\n\nint get_sum(void) {\n  return atomic_load(&a)\
    \ + atomic_load(&b);\n}\n \nvoid set_values(int new_a, int new_b) {\n  atomic_store(&a,\
    \ new_a);\n  atomic_store(&b, new_b);\n}The simple replacement of the twointfields\
    \ with atomic integers fails to eliminate the race condition in the sum because\
    \ the compound operationa.get() + b.get()is still non-atomic. While a sum of some\
    \ value ofaand some value ofbwill be returned, there is no guarantee that this\
    \ value represents the sum of the values ofaandbat any particular moment.Compliant\
    \ Solution (_Atomic struct)This compliant solution uses an atomic struct, which\
    \ guarantees that both numbers are read and written together.#include <stdatomic.h>\n\
    \  \nstatic _Atomic struct ab_s {\n  int a, b;\n} ab;\n \nvoid init_ab(void) {\n\
    \  struct ab_s new_ab = {0, 0};\n  atomic_init(&ab, new_ab);\n}\n \nint get_sum(void)\
    \ {\n  struct ab_s new_ab = atomic_load(&ab);\n  return new_ab.a + new_ab.b;\n\
    }\n \nvoid set_values(int new_a, int new_b) {\n  struct ab_s new_ab = {new_a,\
    \ new_b};\n  atomic_store(&ab, new_ab);\n}On most modern platforms, this will\
    \ compile to be lock-free.Compliant Solution (Mutex)This compliant solution protects\
    \ theset_values()andget_sum()methods with a mutex to ensure atomicity:#include\
    \ <threads.h>\n#include <stdbool.h>\n\nstatic int a;\nstatic int b;\nmtx_t flag_mutex;\n\
    \n/* Initialize everything */\nbool init_all(int type) {\n  /* Check mutex type\
    \ */\n  a = 0;\n  b = 0;\n  if (thrd_success != mtx_init(&flag_mutex, type)) {\n\
    \    return false;  /* Report error */\n  }\n  return true;\n}\n \nint get_sum(void)\
    \ {\n  if (thrd_success != mtx_lock(&flag_mutex)) {\n    /* Handle error */\n\
    \  }\n  int sum = a + b;\n  if (thrd_success != mtx_unlock(&flag_mutex)) {\n \
    \   /* Handle error */\n  }\n  return sum;\n}\n \nvoid set_values(int new_a, int\
    \ new_b) {\n  if (thrd_success != mtx_lock(&flag_mutex)) {\n    /* Handle error\
    \ */\n  }\n  a = new_a;\n  b = new_b;\n  if (thrd_success != mtx_unlock(&flag_mutex))\
    \ {\n    /* Handle error */\n  }\n}Thanks to the mutex, it is now possible to\
    \ add overflow checking to theget_sum()function without introducing the possibility\
    \ of a race condition.Risk AssessmentWhen operations on shared variables are not\
    \ atomic, unexpected results can be produced. For example, information can be\
    \ disclosed inadvertently because one user can receive information about other\
    \ users.RuleSeverityLikelihoodDetectableRepairablePriorityLevelCON07-CMediumProbableYesNoP8L2Automated\
    \ DetectionToolVersionCheckerDescriptionCodeSonar9.1p0CONCURRENCY.DATARACEData\
