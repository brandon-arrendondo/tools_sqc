    \ Coding Standard for JavaVNA02-J. Ensure that compound operations on shared variables\
    \ are atomicMITRE CWECWE-366, Race condition within a threadCWE-413,Improper resource\
    \ lockingCWE-567,Unsynchronized access to shared data in a multithreaded contextCWE-667,\
    \ Improper lockingBibliography[ISO/IEC 14882:2011]Subclause 7.17, \"Atomics\""
