id: CON43-C
type: recommendation
category: CON
number: 43
metadata:
  title: Do not allow data races in multithreaded code
  description: "When multiple threads can read or modify the same data, use synchronization\
    \ techniques to avoid software flaws that can lead to securityvulnerabilities.Data\
    \ racescan often result inabnormal terminationordenial of service, but it is possible\
    \ for them to result in more serious vulnerabilities. The C Standard, section\
    \ 5.1.2.5, paragraph 35 [ISO/IEC 9899:2024], says:\n\nAssume this simplified code\
    \ is part of a multithreaded bank system. Threads callcredit()anddebit()as money\
    \ is deposited into and withdrawn from the single account. Because the addition\
    \ and subtraction operations are not atomic, it is possible that two operations\
    \ can occur concurrently, but only the result of one would be saved—despite declaring\
    \ theaccount_balancevolatile. For example, an attacker can credit the account\
    \ with a sum of money and make a large number of small debits concurrently. Some\
    \ of the debits might not affect the account balance because of the race condition,\
    \ so the attacker is effectively creating money.\n\nstatic volatile int account_balance;\n\
    \nvoid debit(int amount) {\n  account_balance -= amount;\n}\n\nvoid credit(int\
    \ amount) {\n  account_balance += amount;\n}"
  severity: Medium
  likelihood: Probable
  priority: P4
  level: L3
