id: STR32-C
type: rule
category: STR
number: 32
metadata:
  title: Do not pass a non-null-terminated character sequence to a library function
    that expects a string
  description: "Many library functions accept a string or wide string argument with\
    \ the constraint that the string they receive is properly null-terminated. Passing\
    \ a character sequence or wide character sequence that is not null-terminated\
    \ to such a function can result in accessing memory that is outside the bounds\
    \ of the object. Do not pass a character sequence or wide character sequence that\
    \ is not null-terminated to a library function that expects a string or wide string\
    \ argument.\n\nThis code example is noncompliant because the character sequencec_strwill\
    \ not be null-terminated when passed as an argument toprintf().(SeeSTR11-C. Do\
    \ not specify the bound of a character array initialized with a string literalon\
    \ how to properly initialize character arrays.)\n\n#include <stdio.h>\n \nvoid\
    \ func(void) {\n  char c_str[3] = \"abc\";\n  printf(\"%s\\n\", c_str);\n}"
  severity: High
  likelihood: Probable
  priority: P12
  level: L1
  cert_version: 2016 Edition (Wiki)
