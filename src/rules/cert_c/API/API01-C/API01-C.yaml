id: API01-C
type: recommendation
category: API
number: 1
metadata:
  title: Avoid laying out strings in memory directly before sensitive data
  description: "Strings (both character and wide-character) are often subject to buffer\
    \ overflows, which will overwrite the memory immediately past the string. Many\
    \ rules warn against buffer overflows, includingSTR31-C. Guarantee that storage\
    \ for strings has sufficient space for character data and the null terminator.\
    \ Sometimes the danger of buffer overflows can be minimized by ensuring that arranging\
    \ memory such that data that might be corrupted by a buffer overflow is not sensitive.\n\
    \nThis noncompliant code example stores a set of strings using a linked list:\n\
    \nconst size_t String_Size = 20;\nstruct node_s {\n  char name[String_Size];\n\
    \  struct node_s* next;\n}"
  severity: High
  likelihood: Likely
  priority: P18
  level: L1
