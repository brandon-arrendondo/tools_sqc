id: FIO42-C
type: recommendation
category: FIO
number: 42
metadata:
  title: Close files when they are no longer needed
  description: 'A call to thefopen()orfreopen()function must be matched with a call
    tofclose()before the lifetime of the last pointer that stores the return value
    of the call has ended or before normal program termination, whichever occurs first.


    In general, this rule should also be applied to other functions with open and
    close resources, such as the POSIXopen()andclose()functions, or the Microsoft
    WindowsCreateFile()andCloseHandle()functions.


    This code example is noncompliant because the file opened by the call tofopen()is
    not closed before functionfunc()returns:'
