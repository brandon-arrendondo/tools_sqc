id: FIO38-C
type: recommendation
category: FIO
number: 38
metadata:
  title: Do not copy a FILE object
  description: 'According to the C Standard, 7.23.3, paragraph 6 [ISO/IEC 9899:2024],


    Consequently, do not copy aFILEobject.


    This noncompliant code example can fail because a by-value copy ofstdoutis being
    used in the call tofputs():'
