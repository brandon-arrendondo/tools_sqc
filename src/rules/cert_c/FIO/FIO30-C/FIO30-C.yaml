id: FIO30-C
type: recommendation
category: FIO
number: 30
metadata:
  title: Exclude user input from format strings
  description: "Never call a formatted I/O function with a format string containing\
    \ atainted value.  An attacker who can fully or partially control the contents\
    \ of a format string can crash a vulnerable process, view the contents of the\
    \ stack, view memory content, or write to an arbitrary memory location. Consequently,\
    \ the attacker can execute arbitrary code with the permissions of the vulnerable\
    \ process [Seacord 2013b]. Formatted output functions are particularly dangerous\
    \ because many programmers are unaware of their capabilities. For example, formatted\
    \ output functions can be used to write an integer value to a specified address\
    \ using the%nconversion specifier.\n\nTheincorrect_password()function in this\
    \ noncompliant code example is called during identification and authentication\
    \ to display an error message if the specified user is not found or the password\
    \ is incorrect. The function accepts the name of the user as a string referenced\
    \ byuser. This is an exemplar ofuntrusted datathat originates from an unauthenticated\
    \ user. The function constructs an error message that is then output tostderrusing\
    \ the C Standardfprintf()function.\n\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <string.h>\n \nvoid incorrect_password(const char *user) {\n  int ret;\n\
    \  /* User names are restricted to 256 or fewer characters */\n  static const\
    \ char msg_format[] = \"%s cannot be authenticated.\\n\";\n  size_t len = strlen(user)\
    \ + sizeof(msg_format);\n  char *msg = (char *)malloc(len);\n  if (msg == NULL)\
    \ {\n    /* Handle error */\n  }\n  ret = snprintf(msg, len, msg_format, user);\n\
    \  if (ret < 0) { \n    /* Handle error */ \n  } else if (ret >= len) { \n   \
    \ /* Handle truncated output */ \n  }\n  fprintf(stderr, msg);\n  free(msg);\n\
    }"
