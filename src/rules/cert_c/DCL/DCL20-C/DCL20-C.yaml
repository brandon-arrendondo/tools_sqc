id: DCL20-C
type: recommendation
category: DCL
number: 20
metadata:
  title: Explicitly specify void when a function accepts no arguments
  description: 'According to the C Standard, subclause 6.7.6.3, paragraph 14 [ISO/IEC
    9899:2011],


    Subclause 6.11.6 states that


    Consequently, functions that accept no arguments should explicitly declare avoidparameter
    in their parameter list. This holds true in both the declaration and definition
    sections (which should match).'
