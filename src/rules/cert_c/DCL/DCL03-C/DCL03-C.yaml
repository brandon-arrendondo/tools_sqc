id: DCL03-C
type: recommendation
category: DCL
number: 3
metadata:
  title: Use a static assertion to test the value of a constant expression
  description: 'Assertions are a valuable diagnostic tool for finding and eliminating
    software defects that may result invulnerabilities(seeMSC11-C. Incorporate diagnostic
    tests using assertions). The runtimeassert()macro has some limitations, however,
    in that it incurs a runtime overhead and because it callsabort(). Consequently,
    the runtimeassert()macro is useful only for identifying incorrect assumptions
    and not for runtime error checking. As a result, runtime assertions are generally
    unsuitable for server programs or embedded systems.


    Static assertion is a new facility in the C Standard. It takes the form


    static_assert(constant-expression, string-literal);'
  severity: Low
  likelihood: Unlikely
