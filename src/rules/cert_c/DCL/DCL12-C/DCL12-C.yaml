id: DCL12-C
type: recommendation
category: DCL
number: 12
metadata:
  title: Implement abstract data types using opaque types
  description: "Abstract data types are not restricted to object-oriented languages\
    \ such as C++ and Java. They should be created and used in C language programs\
    \ as well. Abstract data types are most effective when used with private (opaque)\
    \ data types and information hiding.\n\nThis noncompliant code example is based\
    \ on the managed string library developed by CERT [Burch 2006]. In this example,\
    \ the managed string type and the functions that operate on this type are defined\
    \ in thestring_m.hheader file as follows:\n\nstruct string_mx {\n  size_t size;\n\
    \  size_t maxsize;\n  unsigned char strtype;\n  char *cstr;\n};\n\ntypedef struct\
    \ string_mx string_mx;\n\n/* Function declarations */\nextern errno_t strcpy_m(string_mx\
    \ *s1, const string_mx *s2);\nextern errno_t strcat_m(string_mx *s1, const string_mx\
    \ *s2);\n/* ... */"
  severity: Low
  likelihood: Unlikely
  priority: P1
  level: L3
