id: DCL41-C
type: rule
category: DCL
number: 41
metadata:
  title: Do not declare variables inside a switch statement before the first case
    label
  description: 'According to the C Standard, 6.8.5.3, paragraph 4 [ISO/IEC 9899:2024],


    If a programmer declares variables, initializes them before the first case statement,
    and then tries to use them inside any of the case statements, those variables
    will have scope inside theswitchblock but will not be initialized and will consequently
    contain indeterminate values.  Reading such values also violatesEXP33-C. Do not
    read uninitialized memory.


    This noncompliant code example declares variables and contains executable statements
    before the first case label within theswitchstatement:'
  severity: Medium
  likelihood: Unlikely
  priority: P6
  level: L2
