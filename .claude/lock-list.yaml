# lock-list.yaml - File locking configuration for work-active workflow
# Specifies which directories/files to lock when using lock-except command

# Directories to lock (everything under these paths will be locked)
lock_directories:
  - src/

# Additional file patterns to lock (optional)
# lock_patterns:
#   - "*.toml"
#   - "*.md"

# Directories/patterns to always exclude from locking
# These are never locked regardless of lock_directories
exclude_always:
  - .git/
  - target/
  - tmp/
  - .claude/
  - scripts/
  - .gitignore
  - Cargo.lock
  - package-lock.json
  - node_modules/
  - __pycache__/
  - "*.pyc"
  - .DS_Store
