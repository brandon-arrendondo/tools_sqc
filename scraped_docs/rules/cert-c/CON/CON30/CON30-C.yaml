id: CON30-C
type: recommendation
category: CON
number: 30
metadata:
  title: Clean up thread-specific storage
  description: "Thetss_create()function creates a thread-specific storage pointer\
    \ identified by a key. Threads can allocate thread-specific storage and associate\
    \ the storage with a key that uniquely identifies the storage by calling thetss_set()function.\
    \ If not properly freed, this memory may be leaked. Ensure that thread-specific\
    \ storage is freed.\n\nIn this noncompliant code example, each thread dynamically\
    \ allocates storage in theget_data()function, which is then associated with the\
    \ global key by the call totss_set()in theadd_data()function. This memory is subsequently\
    \ leaked when the threads terminate.\n\n#include <threads.h>\n#include <stdlib.h>\n\
    \n/* Global key to the thread-specific storage */\ntss_t key;\nenum { MAX_THREADS\
    \ = 3 };\n\nint *get_data(void) {\n  int *arr = (int *)malloc(2 * sizeof(int));\n\
    \  if (arr == NULL) {\n    return arr;  /* Report error  */\n  }\n  arr[0] = 10;\n\
    \  arr[1] = 42;\n  return arr;\n}\n\nint add_data(void) {\n  int *data = get_data();\n\
    \  if (data == NULL) {\n    return -1;\t/* Report error */\n  }\n\n  if (thrd_success\
    \ != tss_set(key, (void *)data)) {\n    /* Handle error */\n  }\n  return 0;\n\
    }\n\nvoid print_data(void) {\n  /* Get this thread's global data from key */\n\
    \  int *data = tss_get(key);\n\n  if (data != NULL) {\n    /* Print data */\n\
    \  } \n}\n\nint function(void *dummy) {\n  if (add_data() != 0) {\n    return\
    \ -1;\t/* Report error */\n  }\n  print_data();\n  return 0;\n}\n\nint main(void)\
    \ {\n  thrd_t thread_id[MAX_THREADS];\n\n  /* Create the key before creating the\
    \ threads */\n  if (thrd_success != tss_create(&key, NULL)) {\n    /* Handle error\
    \ */\n  }\n\n  /* Create threads that would store specific storage */\n  for (size_t\
    \ i = 0; i < MAX_THREADS; i++) {\n    if (thrd_success != thrd_create(&thread_id[i],\
    \ function, NULL)) {\n      /* Handle error */\n    }\n  }\n\n  for (size_t i\
    \ = 0; i < MAX_THREADS; i++) {\n    if (thrd_success != thrd_join(thread_id[i],\
    \ NULL)) {\n      /* Handle error */\n    }\n  }\n\n  tss_delete(key);\n  return\
    \ 0;\n}"
