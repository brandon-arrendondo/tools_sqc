id: CON36-C
type: rule
category: CON
number: 36
metadata:
  title: Wrap functions that can spuriously wake up in a loop
  description: "Thecnd_wait()andcnd_timedwait()functionstemporarily cede possession\
    \ of a mutex so that other threads that may be requesting the mutex can proceed.\
    \ These functions must always be called from code that is protected by locking\
    \ a mutex. The waiting thread resumes execution only after it has been notified,\
    \ generally as the result of the invocation of thecnd_signal()orcnd_broadcast()function\
    \ invoked by another thread. Thecnd_wait()function must be invoked from a loop\
    \ that checks whether acondition predicateholds. A condition predicate is an expression\
    \ constructed from the variables of a function that must be true for a thread\
    \ to be allowed to continue execution. The thread pauses execution, viacnd_wait(),cnd_timedwait(),\
    \ or some other mechanism, and is resumed later, presumably when the condition\
    \ predicate is true and the thread is notified.\n\n#include <threads.h>\n#include\
    \ <stdbool.h>\n \nextern bool until_finish(void);\nextern mtx_t lock;\nextern\
    \ cnd_t condition;\n \nvoid func(void) {\n  if (thrd_success != mtx_lock(&lock))\
    \ {\n    /* Handle error */\n  }\n\n  while (until_finish()) {  /* Predicate does\
    \ not hold */\n    if (thrd_success != cnd_wait(&condition, &lock)) {\n      /*\
    \ Handle error */\n    }\n  }\n \n  /* Resume when condition holds */\n\n  if\
    \ (thrd_success != mtx_unlock(&lock)) {\n    /* Handle error */\n  }\n}\n\nThe\
    \ notification mechanism notifies the waiting thread and allows it to check its\
    \ condition predicate. The invocation ofcnd_broadcast()in another thread cannot\
    \ precisely determine which waiting thread will be resumed. Condition predicate\
    \ statements allow notified threads to determine whether they should resume upon\
    \ receiving the notification."
