id: MSC33-C
type: rule
category: MSC
number: 33
metadata:
  title: Do not pass invalid data to the asctime() function
  description: "The C Standard, 7.29.3.1 [ISO/IEC 9899:2024], provides the following\
    \ sample implementation of theasctime()function:\n\nchar *asctime(const struct\
    \ tm *timeptr) {\n  static const char wday_name[7][3] = {\n    \"Sun\", \"Mon\"\
    , \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\"\n  };\n  static const char mon_name[12][3]\
    \ = {\n    \"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"Jun\",\n    \"Jul\"\
    , \"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\"\n  };\n  static char result[26];\n\
    \  sprintf(\n    result, \n    \"%.3s %.3s%3d %.2d:%.2d:%.2d %d\\n\",\n    wday_name[timeptr->tm_wday],\n\
    \    mon_name[timeptr->tm_mon],\n    timeptr->tm_mday, timeptr->tm_hour,\n   \
    \ timeptr->tm_min, timeptr->tm_sec,\n    1900 + timeptr->tm_year\n  );\n  return\
    \ result;\n}\n\nThis function is supposed to output a character string of 26 characters\
    \ at most, including the terminating null character. If we count the length indicated\
    \ by the format directives, we arrive at 25. Taking into account the terminating\
    \ null character, the array size of the string appears sufficient."
  severity: High
  likelihood: Likely
  priority: P9
  level: L2
