id: INT09-C
type: recommendation
category: INT
number: 9
metadata:
  title: Ensure enumeration constants map to unique values
  description: "A C enumeration defines a type with a finite set of values represented\
    \ by identifiers known asenumeration constants, or enumerators. An enumerator\
    \ is a constant integer expression whose value is representable as anint. Although\
    \ the language allows multiple enumerators of the same type to have the same value,\
    \ it is a common expectation that all enumerators of the same type have distinct\
    \ values. However, defining two or more enumerators of the same type to have the\
    \ same value can lead to some nonobvious errors.\n\nIn this noncompliant code\
    \ example, two enumerators of typeColorare assigned explicit values. It may not\
    \ be obvious to the programmer thatyellowandindigohave been declared to be identical\
    \ values (6), as aregreenandviolet(7). Probably the least dangerous error that\
    \ can result from such a definition is attempting to use the enumerators as labels\
    \ of aswitchstatement. Because all labels in aswitchstatement are required to\
    \ be unique, the following code violates this semantic constraint and is required\
    \ to be diagnosed by aconformingcompiler:\n\nenum Color { red=4, orange, yellow,\
    \ green, blue, indigo=6, violet };\n\nconst char* color_name(enum Color col) {\n\
    \  switch (col) {\n  case red: return \"red\";\n  case orange: return \"orange\"\
    ;\n  case yellow: return \"yellow\";\n  case green: return \"green\";\n  case\
    \ blue: return \"blue\";\n  case indigo: return \"indigo\";   /* Error: duplicate\
    \ label (yellow) */\n  case violet: return \"violet\";   /* Error: duplicate label\
    \ (green) */\n  }\n}"
  severity: Low
  likelihood: Probable
  priority: P4
  level: L3
