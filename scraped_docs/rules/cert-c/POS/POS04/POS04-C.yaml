id: POS04-C
type: recommendation
category: POS
number: 4
metadata:
  title: Avoid using PTHREAD_MUTEX_NORMAL type mutex locks
  description: 'Pthread mutual exclusion (mutex) locks are used to avoid simultaneous
    usage of common resources. Several types of mutex locks are defined by pthreads:NORMAL,ERRORCHECK,RECURSIVE,
    andDEFAULT.


    POSIX describesPTHREAD_MUTEX_NORMALlocks as having the following undefined behavior
    [Open Group 2004]:


    TheDEFAULTmutex pthread is also generally mapped toPTHREAD_MUTEX_NORMALbut is
    known to vary from platform to platform [SOL 2010]. Consequently,NORMALlocks should
    not be used, andERRORCHECKorRECURSIVElocks should be defined explicitly when mutex
    locks are used.'
  severity: Low
  likelihood: Unlikely
  priority: P3
