id: ERR02-C
type: recommendation
category: ERR
number: 2
metadata:
  title: Avoid in-band error indicators
  description: "Avoidin-band error indicatorswhile designing interfaces. This practice\
    \ is commonly used by C library functions but is not recommended. One example\
    \ from the C Standard of a troublesome in-band error indicator isEOF(seeFIO34-C.\
    \ Distinguish between characters read from a file and EOF or WEOF). Another problematic\
    \ use of in-band error indicators from the C Standard involving thesize_tandtime_ttypes\
    \ is described by\n\nThis noncompliant code example is from the Linux Kernel Mailing\
    \ List archive site, although similar examples are common:\n\nint i;\nssize_t\
    \ count = 0;\n\nfor (i = 0; i < 9; ++i) {\n  count += sprintf(\n    buf + count,\
    \ \"%02x \", ((u8 *)&slreg_num)[i]\n  );\n}\ncount += sprintf(buf + count, \"\\\
    n\");"
  severity: Low
  likelihood: Unlikely
