id: DCL21-C
type: recommendation
category: DCL
number: 21
metadata:
  title: Understand the storage of compound literals
  description: "Subclause 6.5.2.5 of the C Standard [ISO/IEC 9899:2011] defines a\
    \ compound literal as\n\nThe storage for this object is either static (if the\
    \ compound literal occurs at file scope) or automatic (if the compound literal\
    \ occurs at block scope), and the storage duration is associated with its immediate\
    \ enclosing block. For example, in the function\n\nvoid func(void) {\n  int *ip\
    \ = (int[4]){1,2,3,4};\n  /* ... */\n}"
  severity: Low
  likelihood: Unlikely
