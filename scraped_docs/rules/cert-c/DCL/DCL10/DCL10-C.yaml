id: DCL10-C
type: recommendation
category: DCL
number: 10
metadata:
  title: Maintain the contract between the writer and caller of variadic functions
  description: "Variadic functions accept a variable number of arguments but are problematic.\
    \ Variadic functions define an implicit contract between the function writer and\
    \ the function user that allows the function to determine the number of arguments\
    \ passed in any particular invocation. Failure to enforce this contract may result\
    \ inundefined behavior. Seeundefined behavior 141of Appendix J of the C Standard.\n\
    \nIn the following code example, the variadic functionaverage()calculates the\
    \ average value of the positive integer arguments passed to the function [Seacord\
    \ 2013]. The function processes arguments until it encounters an argument with\
    \ the value ofva_eol(-1).\n\nenum { va_eol = -1 };\n\nunsigned int average(int\
    \ first, ...) {\n  unsigned int count = 0;\n  unsigned int sum = 0;\n  int i =\
    \ first;\n  va_list args;\n\n  va_start(args, first);\n\n  while (i != va_eol)\
    \ {\n    sum += i;\n    count++;\n    i = va_arg(args, int);\n  }\n\n  va_end(args);\n\
    \  return(count ? (sum / count) : 0);\n}"
  severity: High
  likelihood: Probable
  priority: P6
  level: L2
