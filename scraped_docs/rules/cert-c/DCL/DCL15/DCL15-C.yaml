id: DCL15-C
type: recommendation
category: DCL
number: 15
metadata:
  title: Declare file-scope objects or functions that do not need external linkage
    as static
  description: 'If a file-scope object or a function does not need to be visible outside
    of the file, it should be hidden by being declared asstatic. This practice creates
    more modular code and limits pollution of the global name space.


    Subclause 6.2.2 of the C Standard [ISO/IEC 9899:2011] states:


    and'
