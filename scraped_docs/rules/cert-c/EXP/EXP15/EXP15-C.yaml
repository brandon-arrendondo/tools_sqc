id: EXP15-C
type: recommendation
category: EXP
number: 15
metadata:
  title: Do not place a semicolon on the same line as an if, for, or while statement
  description: "Do not use a semicolon on the same line as anif,for, orwhilestatement\
    \ because it typically indicates programmer error and can result in unexpected\
    \ behavior.\n\nIn this noncompliant code example, a semicolon is used on the same\
    \ line as anifstatement:\n\nif (a == b); {\n  /* ... */\n}"
  severity: High
  likelihood: Likely
  priority: P27
  level: L1
