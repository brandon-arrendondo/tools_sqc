id: EXP33-C
type: rule
category: EXP
number: 33
metadata:
  title: Do not read uninitialized memory
  description: 'Local, automatic variables assume unexpected values if they are read
    before they are initialized. The C Standard, 6.7.11, paragraph 11, specifies [ISO/IEC
    9899:2024]


    Seeundefined behavior 11.


    When local, automatic variables are stored on the program stack, for example,
    their values default to whichever values are currently stored in stack memory.'
