id: EXP16-C
type: recommendation
category: EXP
number: 16
metadata:
  title: Do not compare function pointers to constant values
  description: "Comparing a function pointer to a value that is not a null function\
    \ pointer of the same type will be diagnosed because it typically indicates programmer\
    \ error and can result inunexpected behavior. Implicit comparisons will be diagnosed,\
    \ as well.\n\nIn this noncompliant code example, the addresses of the POSIX functionsgetuidandgeteuidare\
    \ compared for equality to 0. Because no function address shall be null, the first\
    \ subexpression will always evaluate to false (0), and the second subexpression\
    \ always to true (nonzero). Consequently, the entire expression will always evaluate\
    \ to true, leading to a potential security vulnerability.\n\n/* First the options\
    \ that are allowed only for root */\nif (getuid == 0 || geteuid != 0) {\n  /*\
    \ ... */\n}"
  severity: Low
  likelihood: Likely
  priority: P6
  level: L2
