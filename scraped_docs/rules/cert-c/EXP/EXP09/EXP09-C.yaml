id: EXP09-C
type: recommendation
category: EXP
number: 9
metadata:
  title: Use sizeof to determine the size of a type or variable
  description: "Do not hard code the size of a type into an application. Because of\
    \ alignment, padding, and differences in basic types (e.g., 32-bit versus 64-bit\
    \ pointers), the size of most types can vary between compilers and even versions\
    \ of the same compiler. Using thesizeofoperator to determine sizes improves the\
    \ clarity of what is meant and ensures that changes between compilers or versions\
    \ will not affect the code.\n\nType alignment requirements can also affect the\
    \ size of structures. For example, the size of the following structure isimplementation-defined:\n\
    \nstruct s {\n  int i;\n  double d;\n};"
  severity: High
  likelihood: Unlikely
  priority: P6
  level: L2
