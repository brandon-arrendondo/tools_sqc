id: FIO03-C
type: recommendation
category: FIO
number: 3
metadata:
  title: Do not make assumptions about fopen() and file creation
  description: "The Cfopen()function is used to open an existing file or create a\
    \ new one. The C11 version of thefopen()function provides a mode flag,x, that\
    \ provides the mechanism needed to determine if the file that is to be opened\
    \ exists. Not using this mode flag can lead to a program overwriting or accessing\
    \ an unintended file.\n\nIn this noncompliant code example, the file referenced\
    \ byfile_nameis opened for writing. This example is noncompliant if the programmer's\
    \ intent was to create a new file, but the referenced file already exists.\n\n\
    char *file_name;\nFILE *fp;\n\n/* Initialize file_name */\n\nfp = fopen(file_name,\
    \ \"w\");\nif (!fp) {\n  /* Handle error */\n}"
  severity: Medium
  likelihood: Probable
