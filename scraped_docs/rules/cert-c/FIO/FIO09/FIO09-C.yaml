id: FIO09-C
type: recommendation
category: FIO
number: 9
metadata:
  title: Be careful with binary data when transferring data across systems
  description: "Portability is a concern when using thefread()andfwrite()functions\
    \ across multiple, heterogeneous systems. In particular, it is never guaranteed\
    \ that reading or writing of scalar data types such as integers, let alone aggregate\
    \ types such as arrays or structures, will preserve the representation or value\
    \ of the data. Implementations may differ in structure padding, floating-point\
    \ model, number of bits per byte, endianness, and other attributes that cause\
    \ binary data formats to be incompatible.\n\nThis noncompliant code example reads\
    \ data from a file stream into a data structure:\n\nstruct myData {\n  char c;\n\
    \  long l;\n};\n\n/* ... */\n\nFILE *file;\nstruct myData data;\n\n/* Initialize\
    \ file */\n\nif (fread(&data, sizeof(struct myData), 1, file) < sizeof(struct\
    \ myData)) {\n  /* Handle error */\n}"
