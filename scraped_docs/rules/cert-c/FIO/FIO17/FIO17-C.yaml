id: FIO17-C
type: recommendation
category: FIO
number: 17
metadata:
  title: Do not rely on an ending null character when using fread()
  description: 'Thefread()function, as defined in the C Standard, subclause 7.21.8.1
    [ISO/IEC 9899:2011], does not explicitly null-terminate the read character sequence.


    Although the content of a file has a properly null-terminated character sequence,
    ifnmembis less than the total length of the characters, thefread()function will
    not read afternmembcharacters.fread()will not append a null character to the end
    of the string being read to.


    Suppose we have a null-terminated character sequence in a file, and we need to
    extract a null-terminated byte string:'
