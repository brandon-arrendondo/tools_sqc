id: PRE04-C
type: recommendation
category: PRE
number: 4
metadata:
  title: Do not reuse a standard header file name
  description: 'If a file with the same name as a standard header is placed in the
    search path for included source files, the behavior isundefined.


    The following table from the C Standard, subclause 7.1.2 [ISO/IEC 9899:2011],
    lists these standard headers:


    <assert.h><float.h><math.h><stdatomic.h><stdlib.h><time.h><complex.h><inttypes.h><setjmp.h><stdbool.h><stdnoreturn.h><uchar.h><ctype.h><iso646.h><signal.h><stddef.h><string.h><wchar.h><errno.h><limits.h><stdalign.h><stdint.h><tgmath.h><wctype.h><fenv.h><locale.h><stdarg.h><stdio.h><threads.h>'
  severity: Low
  likelihood: Unlikely
  priority: P2
  level: L3
