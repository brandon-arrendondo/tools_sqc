id: PRE08-C
type: recommendation
category: PRE
number: 8
metadata:
  title: Guarantee that header file names are unique
  description: 'Make sure that included header file names are unique. According to the
    C Standard, subclause 6.10.2, paragraph 5 [ISO/IEC 9899:2011],


    This means that


    To guarantee that header file names are unique, all included files should differ
    (in a case-insensitive manner) in their first eight characters or in their (one-character)
    file extension.'
