id: STR37-C
type: recommendation
category: STR
number: 37
metadata:
  title: Arguments to character-handling functions must be representable as an unsigned
    char
  description: 'According to the C Standard, 7.4.1 paragraph 1 [ISO/IEC 9899:2024],


    See alsoundefined behavior 112.


    This rule is applicable only to code that runs on platforms where thechardata
    type is defined to have the same range, representation, and behavior assigned
    char.'
