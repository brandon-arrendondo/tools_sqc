id: STR02-C
type: recommendation
category: STR
number: 2
metadata:
  title: Sanitize data passed to complex subsystems
  description: 'String data passed to complex subsystems may contain special characters
    that can trigger commands or actions, resulting in a softwarevulnerability. As
    a result, it is necessary tosanitizeall string data passed to complex subsystems
    so that the resulting string is innocuous in the context in which it will be interpreted.


    These are some examples of complex subsystems:


    Data sanitization requires an understanding of the data being passed and the capabilities
    of the subsystem. John Viega and Matt Messier provide an example of an application
    that inputs an email address to a buffer and then uses this string as an argument
    in a call tosystem()[Viega 2003]:'
